name: Изграждане и публикуване

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Изграждане за хостинга (канонични адреси към kalendarat.com; AdSense, ако е зададен)
        env:
          ADSENSE_ID: ${{ vars.ADSENSE_ID }}
        run: OUT=dist node tools/build.cjs
      - name: Изграждане на копие за GitHub Pages (без индексиране)
        run: NOINDEX=1 OUT=dist-pages node tools/build.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Качване на хостинга по FTP. Включва се от Settings → Secrets and variables → Actions → Variables: DEPLOY_HOSTING = true
  deploy-hosting:
    needs: build
    if: ${{ vars.DEPLOY_HOSTING == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          local-dir: dist/
          server-dir: ${{ vars.FTP_DIR || '/public_html/' }}
