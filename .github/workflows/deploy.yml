name: Преглед в GitHub Pages

# Всяко сливане в main изгражда сайта и го публикува за преглед в GitHub Pages (с noindex).
# На домейна се публикува отделно, ръчно: workflow „Публикуване на домейна“.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Изграждане на копие за преглед (без индексиране)
        run: NOINDEX=1 OUT=dist-pages node tools/build.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
