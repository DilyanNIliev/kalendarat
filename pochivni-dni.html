<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Почивни дни и официални празници 2026–2029</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="wrap">
  <h1 style="margin-top:28px;color:var(--orange)" id="title"></h1>
  <div class="years" id="tabs"></div>
  <p class="muted" id="summary"></p>
  <div class="legend">
    <span><i class="sw off"></i>Официален почивен ден</span>
    <span><i class="sw idea"></i>Предложение за отпуск</span>
    <span><i class="sw easter"></i>Великден</span>
    <span><i class="sw school"></i>Неучебен ден / ваканция</span>
    <span><i class="sw we"></i>Събота и неделя</span>
  </div>
  <div class="grid">
    <section class="card"><h2>Официални празници</h2><ul class="list" id="holidays"></ul></section>
    <section class="card"><h2>Идеи за отпуски</h2><div id="ideas"></div></section>
  </div>
  <section class="card" id="school-card"><h2>Учебни ваканции и неучебни дни</h2><ul class="list" id="school"></ul></section>
  <h2 style="margin-top:28px">Календар по месеци</h2>
  <div class="months" id="months"></div>
</main>
<script src="js/holidays.js"></script>
<script src="js/namedays.js"></script>
<script src="js/common.js"></script>
<script src="js/calendar.js"></script>
</body>
</html>
