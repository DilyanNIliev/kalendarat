<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dilyanilievdesign – скоро</title>
<meta name="robots" content="noindex, follow">
<meta name="description" content="dilyanilievdesign – страницата е в подготовка.">
<style>
:root{--bg:#f6f2fd;--ink:#1f1236;--muted:#5f5280;--acc:#6d28d9;--card:#fff;--line:#e1d8f2}
@media (prefers-color-scheme:dark){:root{--bg:#130a24;--ink:#f1eafc;--muted:#ab9bcb;--acc:#c9b3ff;--card:#1d1335;--line:#3a2762}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
main{max-width:520px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:36px 28px;text-align:center}
h1{font-size:clamp(1.8rem,6vw,2.4rem);margin:0 0 8px;letter-spacing:-.02em}
p{margin:0 0 20px;color:var(--muted)}
a.btn{display:inline-block;background:var(--acc);color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:12px}
@media (prefers-color-scheme:dark){a.btn{color:#130a24}}
a.btn:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
small{display:block;margin-top:22px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Скоро</h1>
  <p>Тази страница е в подготовка.</p>
  <a class="btn" href="https://kalendarat.com/">Към kalendarat.com</a>
  <small>Календар на празниците, почивните дни, имените дни и ваканциите в България.</small>
</main>
</body>
</html>
